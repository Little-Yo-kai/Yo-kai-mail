[project]
name = "backend"
version = "0.1.0"
description = "Yo-kai Mail backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery>=5.6.3",
    "dj-rest-auth>=7.2.0",
    "django>=6.1.1",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "firecrawl-py>=4.42.0,<5.0.0",
    "google-genai>=1.0.0",
    "pydantic>=2.10.0",
    "psycopg2-binary>=2.9.13",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]
